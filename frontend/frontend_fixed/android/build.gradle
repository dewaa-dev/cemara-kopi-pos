// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// ✅ FIX: react-native-bluetooth-classic hardcode compileSdkVersion 29 di
// build.gradle miliknya sendiri (di node_modules), TIDAK otomatis ikut
// compileSdk 36 dari root project / expo-build-properties. Java 9+ source
// butuh compileSdk minimal 30, sehingga build gagal dengan compileSdk 29.
//
// Block ini memaksa SEMUA subproject (termasuk library pihak ketiga) pakai
// compileSdk & buildToolsVersion yang sama dengan root project.
subprojects { subproject ->
  afterEvaluate {
    if (subproject.hasProperty('android')) {
      android {
        compileSdkVersion 36
        buildToolsVersion "36.0.0"
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"